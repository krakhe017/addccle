services:
  - type: web
    name: esq-bypass
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SALT
        sync: false
      - key: DEMO_USER
        sync: false
      - key: DEMO_PASS
        sync: false
      - key: VIP_USER
        sync: false
      - key: VIP_PASS
        sync: false
      - key: WALLET_USDT_BEP20
        sync: false
      - key: WALLET_USDT_TRC20
        sync: false
      - key: WALLET_LTC
        sync: false
      - key: WALLET_BTC
        sync: false
      - key: PLAN_PRICE
        value: "34.99"
      - key: PLAN_NAME
        value: "Esquele Lifetime"
      - key: PLAN_CCS
        value: "25"
      - key: ADMIN_KEY
        generateValue: true
      - key: RATE_LIMIT_WINDOW
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "100"
    disk:
      name: esq-data
      mountPath: /data
      sizeGB: 1